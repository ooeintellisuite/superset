# Docker Compose for Superset Deployment
# This file is used by Azure DevOps pipeline for production deployments
x-superset-volumes: &superset-volumes
  - superset_home:/app/superset_home

services:
  redis:
    image: redis:7
    container_name: superset_cache
    restart: unless-stopped
    networks:
      - superset-network
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset-init:
    image: ${SUPERSET_IMAGE:?SUPERSET_IMAGE environment variable is not set or empty}
    container_name: superset_init
    command: ["/app/docker/docker-init.sh"]
    user: "root"
    networks:
      - superset-network
      - oeeintellisuite
    environment:
      # Superset configuration
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY environment variable is not set or empty}

      # Metadata database (consolidated into oee-postgres)
      # These must be set as environment variables for superset_config.py
      DATABASE_DIALECT: postgresql
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: oee-postgres
      DATABASE_PORT: "5432"
      DATABASE_DB: superset_meta

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Webserver port - must match container port mapping
      SUPERSET_PORT: "5760"
      # Superset admin credentials (from blue-dev secret)
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:?SUPERSET_ADMIN_USER is required}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD is required}
    depends_on:
      redis:
        condition: service_healthy
    volumes: *superset-volumes
    healthcheck:
      disable: true

  superset:
    image: ${SUPERSET_IMAGE:?SUPERSET_IMAGE environment variable is not set or empty}
    container_name: superset_app
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    user: "root"
    restart: unless-stopped
    networks:
      - superset-network
      - oeeintellisuite
    ports:
      - "${SUPERSET_PORT:-5760}:5760"
    environment:
      # Superset configuration
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY environment variable is not set or empty}

      # Metadata database (consolidated into oee-postgres)
      # These must be set as environment variables for superset_config.py
      DATABASE_DIALECT: postgresql
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: oee-postgres
      DATABASE_PORT: "5432"
      DATABASE_DB: superset_meta

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Webserver port - must match container port mapping
      SUPERSET_PORT: "5760"

    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes

networks:
  superset-network:
    name: ${DOCKER_NETWORK}
    external: false
  oeeintellisuite:
    name: oeeintellisuite
    external: true

volumes:
  superset_home:
  redis:
