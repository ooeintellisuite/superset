# Docker Build, Push & Run with GitHub repo + Self-hosted agent

trigger:
  branches:
    include:
      - master     # GitHub main branch trigger

resources:
  repositories:
    - repository: self
      type: git
      name: ooeintellisuite/superset     # GitHub repo name
      ref: refs/heads/master

variables:
  dockerRegistryServiceConnection: 'a10db51c-fc0e-4bf5-b19d-4383916b948b'
  imageRepository: 'intellisuite'
  containerRegistry: 'intellisuiteupwork.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  containerName: 'superset-container'  # Name for the container

stages:
- stage: Build
  displayName: Build, Push & Run
  jobs:
  - job: Build
    displayName: Build & Push Docker Image
    pool:
      name: Default     # Your self-hosted agent pool
    steps:
    - task: Docker@2
      displayName: Build and Push
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

    - task: Docker@2
      displayName: Run Docker Container
      inputs:
        command: run
        containerName: $(containerName)
        image: $(containerRegistry)/$(imageRepository):$(tag)
        ports: '8088:8088'        
        detach: true             
